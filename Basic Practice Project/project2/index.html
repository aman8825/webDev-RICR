<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>This is Survey Form.</h1>
        </div>
        <div class="a">
        <form action="">
            <label for="name">Name</label>
            <input type="text" placeholder="Enter your name"><br>
            <label for="">Email</label>
            <input type="email" placeholder="Enter your email"><br>
            <label for="age">Age</label>
            <input type="number" placeholder="Enter your age"><br>
            <label for="">Which option best describe you?</label><br>
            <select name="" id="">
                <option value="select">--Select--</option>
                <option value="student">Studen</option>
                <option value="intern">Intern</option>
                <option value="professional">Professional</option>
                <option value="other">Other</option>
            </select><br>
            </div>
            <div class="b">
            <label for="">Would you recommend this Website to a friend?</label><br>
            <input type="radio" name="friend?">
            <span>Yes</span><br>
            <input type="radio" name="friend?">
            <span>No</span><br>
            <input type="radio">
            <span>Maybe</span><br>
            <label for="" id="d">Languages and Frameworks known <small>(check all that apply)</small></label><br>
            <input type="checkbox">
            <span>C</span><br>
            <input type="checkbox">
            <span>C++</span><br>
            <input type="checkbox">
            <span>C#</span><br>
            <input type="checkbox">
            <span>Java</span><br>
            <input type="checkbox">
            <span>Python</span><br>
            <input type="checkbox">
            <span>JavaScript</span><br>
            <input type="checkbox">
            <span>React</span><br>
            <input type="checkbox">
            <span>Angular</span><br>
            <input type="checkbox">
            <span>Django</span><br>
            <input type="checkbox">
            <span>Spring</span><br>
            </div>
        <div class="c">
            <label for="">Any Comments or suggestions</label><br>
            <textarea name=""  placeholder="Enter your comment here"></textarea>
        </div>
        
        <input id="button" type="submit" value="Log In ">
        
        </form>
    </div>
</body>
</html>
