<!DOCTYPE html>
<html>
<head>
<title>Enquiry Form</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h2>Enquiry Form</h2>
<p>Have questions or need assistance? Fill out the form & we will get back to you.</p>

<form>

<table>

<tr>
<td><label for="name">Person Name*</label>
    <input type="text" placeholder="Person Name"></td>
<td><label for="Number">Contact Number*</label>
    <input type="text" placeholder="Contact Number"></td>
</tr>

<tr>
<td><label for="email">Email*</label>
    <input type="email" placeholder="Email"></td>
<td><label for="qualification">Qualification</label>
    <input type="text" placeholder="Qualification"></td>
</tr>

<tr>
<td colspan="2">
    <label for="College/School">College/School Name*</label>
<input type="text" placeholder="College/School Name">
</td>
</tr>

<tr>
<td><label for="Year">Year*</label>
    <input type="text" placeholder="Year"></td>
<td>
    <label for="Branch">Branch*</label>
<select>
<option>Branch</option>
<option>CSE</option>
<option>IT</option>
<option>Mechanical</option>
<option>Civil</option>
</select>
</td>
</tr>

<tr>
<td class="checkbox-group">

<b>Interested in Which Course?</b><br>

<input type="checkbox"> <span>Full Stack Web Development-Placment Oriented</span>
<label><input type="checkbox"> Data Analytics with Python-Placment Oriented</label>
<label><input type="checkbox"> Data Analytics with Python - Placement Oriented</label>
<label><input type="checkbox"> Business Analytst</label>
<label><input type="checkbox"> Java Programming</label>
<label><input type="checkbox"> Python Programming</label>
<label><input type="checkbox"> C/C++ Programming</label>
<label><input type="checkbox"> Other</label>

</td>

<td>

<label>Source of Information</label><br>
<select>
<option>Select</option>
<option>Facebook</option>
<option>Instagram</option>
<option>Friend</option>
<option>Website</option>
</select>

<br><br>

<label>Name of Executive</label><br>
<select>
<option>Select</option>
<option>Executive 1</option>
<option>Executive 2</option>
</select>

</td>
</tr>

<tr>
<td colspan="2" class="center">
<button type="submit">Submit</button>
</td>
</tr>

</table>

</form>

</div>

</body>
</html>
