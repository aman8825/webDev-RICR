<!DOCTYPE html>
<html>
<head>
<title>Enquiry Form</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="form-container">

<h2>Enquiry Form</h2>
<p>Have questions or need assistance? Fill out the form & we will get back to you.</p>

<form>

<div class="row">
    <label for="name">Person Name*</label> 
    
<input type="text" placeholder="Please Name">
<label for="contact">Contact Number*</label>
<input type="text" placeholder="Contact Number">
</div>

<div class="row">
    <label for="email" >Email*</label>
<input type="email" placeholder="Email">
<label for="Qualification">Qualification*</label>
<input type="text" placeholder="Qualification">
</div>
<label for="College/School">College/School Name*</label>
<input class="full" type="text" placeholder="College/School Name">

<div class="row">
<label for="year">Year</label>
<input type="text" placeholder="Year">
<label for="branch">Branch*</label>
<select>
<option>Branch</option>
<option>CSE</option>
<option>IT</option>
<option>Mechanical</option>
<option>Civil</option>
</select>
</div>

<div class="grid">

<div class="left">
<b>Interested in Which Course?</b><br>

<label><input type="checkbox"> Full Stack Web Development</label>
<label><input type="checkbox"> Data Analytics with Python</label>
<label><input type="checkbox"> Data Analytics with Python - Placement Oriented</label>
<label><input type="checkbox"> Database</label>
<label><input type="checkbox"> Java Programming</label>
<label><input type="checkbox"> Python Programming</label>
<label><input type="checkbox"> C/C++ Programming</label>
<label><input type="checkbox"> Other</label>

</div>

<div class="right">

<label>Source of Information</label>
<br>
<h5>
(Only choose 'Received call from institute' if you actually got a call from us)*</h5>
<select>
<option>Source of Information</option>
<option>Facebook</option>
<option>Instagram</option>
<option>Friend</option>
<option>Website</option>
</select>

<label>Name of Executive</label>
<select>
<option>Name of Executive</option>
<option>Executive 1</option>
<option>Executive 2</option>
</select>

</div>

</div>

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
