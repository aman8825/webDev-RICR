<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Goal Tracker 🎯</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header class="m-auto text-center fw-bolder fs-5 bg-light-subtle p-3">
      <h1>Daily Goal Tracker 🎯</h1>
      <h5>Add your daily goals and track your progress.</h5>
    </header>
    <main>
      <div class="container rounded border shadow my-2 d-flex gap-4 p-3">
        <input
          type="text"
          class="form-control w-75 ms-3 border-bottom"
          placeholder="Enter a Goal" id="newGoal"
        />
        <button
          class="btn ms-4 bg-success d-flex gap-3 align-items-center justify-content-center text-white rounded-2"
        ondblclick="addGoal()">
          <i class="bi bi-plus-circle"></i>Add Goal
        </button>
      </div>
    </main>
    
    <div class="container rounded border shadow my-2 p-3 d-none" id="taskDiv">
      <ol id="taskList">
        <!-- <li class="my-3">
          <div class="d-flex align-items-center gap-5">
            <span>Goal 1</span>
            div 
            <button
              class="btn bg-danger d-flex gap-3 align-items-center justify-content-center text-white rounded-2"
            >
              <i class="bi bi-trash"></i>Delete
            </button>
            
          </div>
        </li> -->
      </ol>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="dailyGoal.js"></script>
  </body>
</html>
