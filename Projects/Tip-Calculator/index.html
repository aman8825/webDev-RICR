<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container" class="m-auto">
      <div id="forms" class="w-75 m-auto pt-4">
        <div id="head" class="border rounded-3 text-center">
          <h2>TIP CALCULATOR</h2>
        </div>
        <form action="" class=" bg-white border rounded-3 shadow mt-3 p-3 d-flex flex-column gap-3">
          <label for="billAmount">Bill Amount</label>
          <input type="number" class="form-control InputBox"  id="billAmount" />
          <label for="service">How was the Service? </label>
          <select name="service" id="Service" class="form-control InputBox"">
            <option value="select">--Select--</option>

            <option value="25">25% - Top Notch</option>
            <option value="20">20% - Excellent</option>
            <option value="15">15% - Good</option>
            <option value="10">10% - Bad</option>
            <option value="5">5% - Worst</option>
          </select>
          <label for="numberOfPerson">Total Number of Person</label>
          <input type="number" id="PersonNumber" class="form-control InputBox"" placeholder="Number of people sharing the bill">
          <button type="submit" class="btn btn-info border rounded-3 mb-4 mt-2">Calculate</button>
          <div id="" class=" text-center">
            <h4>Trip Amount: <span id="Tip">XX ₹</span></h4>
    <!-- Trip Amount: <span id="Tip">XX ₹</span> -->
</div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
