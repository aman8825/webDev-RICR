<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="p-3 text-center border shadow rounded-2">🌤️Mausam Ka Haal </header>
    <div class="container w-50 shadow rounded-3 p-2 mt-5 " id="main">
     
      
    <div class="container border shadow rounded-2 pb-2 " >
      <div class="d-flex">
    <input type="text" id="cityName" class="form-control mt-3 " placeholder="Enter your cityName" />
    <button onclick="getWeather()" class="btn btn-primary mt-4 ms-5">Get Weather</button>
</div>
</div>
    <br /> 
    <div class="icon">⛅</div>
    <div class=" m-auto  ms-5 p-5">
       
 <div class="container  d-flex gap-5">
    <div class=" con text-center"  >
      <label class="mt-4">Temp : <span id="Temperature" >30</span>ºC 🌡️</label>
    </div>
    <div class=" con text-center">
      <label class="mt-4">Humidity : <span id="Humidity" >30</span></label>
    </div>
 </div>
 <div class="container mt-5 d-flex gap-5">
    <div class="mt-3 con text-center"  >
      <label class="mt-4">Temp_min : <span id="Temp_min" >30</span>ºC </label>
    </div>
    <div class="mt-3 con text-center">
      <label class="mt-4">Temp_max : <span id="Temp_max" >30</span></label>
    </div>
 </div>
 </div>
    </div>
    
    <!-- BootStrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
