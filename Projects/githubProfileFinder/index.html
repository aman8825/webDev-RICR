    <header class="p-3 bg-success fs-3 fw-bold"><i class="bi bi-github"></i>  Github Profile Finder</header>

</div>
<div class="input-group w-50 gap-4  m-auto mt-4">

</div>
<div class="main mt-5 w-50 m-auto card border  w border-black">
<div class="d-flex gap-4 ">

        <h5>userName</h5> 
        <p>Name</p> 
        <p>Bio</p> 
        <div class="d-flex gap-5 mt-5">
            <p id="location">location</p>
            
          <p id="join">join</p>
            <p id="lastUpdate">Last update</p>
        </div>
    </div>
</div>
<div id="GitHubLink" class="m-2 border border-1 border-success rounded-2 text-center " ><a href="" class="text-decoration-none text-success">View profile on Github <i class="bi bi-box-arrow-up-right"></i></a></div>
</div>
